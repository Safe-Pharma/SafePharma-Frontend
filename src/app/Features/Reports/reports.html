<section class="module-motion-page app-page">
  <app-page-header class="module-motion-header" [icon]="'reports'" [title]="i18n.text('report.title')" [description]="i18n.text('report.open')" />

  <div class="module-motion-report-grid app-page-section grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
    <a routerLink="/app/sales" class="report-card">
      <span class="report-icon bg-primary-soft text-primary" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H20v13H6.5A2.5 2.5 0 0 1 4 15.5z"/><path d="M4 7.5v9"/><path d="M16 12h.01"/></svg></span>
      <span>
        <span class="report-title">{{ i18n.text('report.sales') }}</span>
        <span class="report-description">{{ i18n.text('report.salesDescription') }}</span>
      </span>
      <span class="report-arrow directional-icon" aria-hidden="true">→</span>
    </a>

    <a routerLink="/app/inventory" class="report-card">
      <span class="report-icon bg-success-soft text-success">▦</span>
      <span>
        <span class="report-title">{{ i18n.text('report.inventory') }}</span>
        <span class="report-description">{{ i18n.text('report.inventoryDescription') }}</span>
      </span>
      <span class="report-arrow directional-icon" aria-hidden="true">→</span>
    </a>

    <a routerLink="/app/audit" class="report-card">
      <span class="report-icon bg-warning-soft text-warning">✓</span>
      <span>
        <span class="report-title">{{ i18n.text('report.audit') }}</span>
        <span class="report-description">{{ i18n.text('report.auditDescription') }}</span>
      </span>
      <span class="report-arrow directional-icon" aria-hidden="true">→</span>
    </a>
  </div>
</section>
