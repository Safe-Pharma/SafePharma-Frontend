<div class="filter-bar">
  <div class="search-field">
    <svg class="search-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
      <circle cx="7" cy="7" r="5.25" stroke="currentColor" stroke-width="1.5" />
      <path d="M14 14L11 11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
    </svg>
    <input
      type="text"
      [placeholder]="i18n.text('users.search')"
      [ngModel]="search()"
      (ngModelChange)="onSearchInput($event)"
    />
  </div>

  <select class="select" [ngModel]="role()" (ngModelChange)="onRoleChange($event)">
    <option value="">{{ i18n.text('users.allRoles') }}</option>
    @for (r of roles(); track r.id) {
      <option [value]="r.name">{{ i18n.roleLabel(r.name) }}</option>
    }
  </select>

  <select class="select" [ngModel]="status()" (ngModelChange)="onStatusChange($event)">
    @for (s of statuses; track s) {
      <option [value]="s">{{ s === 'All' ? i18n.text('users.allStatuses') : s === 'Active' ? i18n.text('users.active') : i18n.text('users.inactive') }}</option>
    }
  </select>
</div>
