<app-modal-shell
  size="lg"
  [title]="i18n.text('users.editTitle')"
  [subtitle]="i18n.text('users.editSubtitle', { name: user().name })"
  (close)="onCancel()"
>
  <app-user-form
    mode="edit"
    [initialValue]="initialValue()"
    [serverErrors]="serverErrors()"
  />

  <div modalFooter class="footer-actions">
    <button class="btn btn-secondary" (click)="onCancel()" [disabled]="isSubmitting()">
      {{ i18n.text('users.cancel') }}
    </button>
    <button class="btn btn-primary" (click)="onSubmit()" [disabled]="isSubmitting()">
      {{ isSubmitting() ? i18n.text('users.saving') : i18n.text('users.saveChanges') }}
    </button>
  </div>
</app-modal-shell>
