<app-modal-shell
  title="Edit user"
  subtitle="Update {{ user().name }}'s role, branch, and contact details."
  (close)="onCancel()"
>
  <app-user-form mode="edit" [initialValue]="initialValue()" />
 
  <div modalFooter class="footer-actions">
    <button class="btn btn-secondary" (click)="onCancel()">Cancel</button>
    <button class="btn btn-primary" (click)="onSubmit()">Save changes</button>
  </div>
</app-modal-shell>
