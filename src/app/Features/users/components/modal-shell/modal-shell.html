<div appModalOverlay class="backdrop" role="presentation" (click)="close.emit()">
  <div class="panel" role="dialog" aria-modal="true" [attr.aria-label]="title()" [class]="'panel panel-' + size()" (click)="$event.stopPropagation()">

    <header class="panel-header">
      <div>
        <h2>{{ title() }}</h2>
        @if (subtitle()) {
          <p class="subtitle">{{ subtitle() }}</p>
        }
      </div>
      <button class="close-btn" (click)="close.emit()" [attr.aria-label]="i18n.text('users.close')">✕</button>
    </header>

    <!-- scrollable body — only this part scrolls -->
    <div class="panel-body">
      <ng-content />
    </div>

    <!-- footer always visible at the bottom, never scrolls away -->
    <footer class="panel-footer">
      <ng-content select="[modalFooter]" />
    </footer>

  </div>
</div>
