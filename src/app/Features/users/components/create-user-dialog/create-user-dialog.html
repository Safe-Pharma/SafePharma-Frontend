<app-modal-shell
  size="lg"
  title="Create new user"
  subtitle="Invite a team member and assign role and branch."
  (close)="onCancel()"
>
  <app-user-form
    mode="create"
    [serverErrors]="serverErrors()"
  />

  <div modalFooter class="footer-actions">
    <button class="btn btn-secondary" (click)="onCancel()" [disabled]="isSubmitting()">
      Cancel
    </button>
    <button class="btn btn-primary" (click)="onSubmit()" [disabled]="isSubmitting()">
      {{ isSubmitting() ? 'Creating...' : 'Create user' }}
    </button>
  </div>
</app-modal-shell>
