<app-modal-shell
  size="lg"
  [title]="i18n.text('users.createTitle')"
  [subtitle]="i18n.text('users.createSubtitle')"
  (close)="onCancel()"
>
  <app-user-form
    mode="create"
    [serverErrors]="serverErrors()"
  />

  <div modalFooter class="footer-actions">
    <button class="btn btn-secondary" (click)="onCancel()" [disabled]="isSubmitting()">
      {{ i18n.text('users.cancel') }}
    </button>
    <button class="btn btn-primary" (click)="onSubmit()" [disabled]="isSubmitting()">
      {{ isSubmitting() ? i18n.text('users.creating') : i18n.text('users.create') }}
    </button>
  </div>
</app-modal-shell>
