<div class="module-motion-page app-page users-page">
  <app-page-header class="module-motion-header" [icon]="'users'" [title]="i18n.text('users.title')" [description]="i18n.text('users.subtitle')">
    <div pageHeaderActions>
      <button type="button" class="app-page-action app-page-action-primary" (click)="onCreateUser()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12h14"></path><path d="M12 5v14"></path>
        </svg>
        {{ i18n.text('users.create') }}
      </button>
    </div>
  </app-page-header>

  <section class="module-motion-panel app-page-section card">
    <app-users-filter-bar
      [search]="usersService.searchTerm()"
      [role]="usersService.roleFilter()"
      [status]="usersService.statusFilter()"
      (searchChange)="usersService.setSearch($event)"
      (roleChange)="usersService.setRoleFilter($event)"
      (statusChange)="usersService.setStatusFilter($event)"
    />

    <app-users-table
      [users]="usersService.users()"
      [loading]="usersService.isLoading()"
      (view)="onView($event)"
      (edit)="onEdit($event)"
      (delete)="onDelete($event)"
      (toggleStatus)="onToggleStatus($event)"
    />

    @if (usersService.isLoading() && usersService.users().length > 0) {
      <div class="refreshing" role="status"><span class="inline-spinner"></span> {{ i18n.text('users.updating') }}</div>
    }

    @if (usersService.error()) {
      <div class="error">{{ usersService.error() }}</div>
    }

    <app-pagination
      [page]="usersService.page()"
      [totalPages]="usersService.totalPages()"
      [rangeStart]="usersService.rangeStart()"
      [rangeEnd]="usersService.rangeEnd()"
      [total]="usersService.totalCount()"
      (prev)="usersService.prevPage()"
      (next)="usersService.nextPage()"
    />
  </section>

  @if (isCreateDialogOpen()) {
    <app-create-user-dialog
      (closed)="onCreateDialogClosed()"
      (created)="onCreateDialogClosed()"
    />
  }

  @if (editingUser(); as u) {
    <app-edit-user-dialog
      [user]="u"
      (closed)="onEditDialogClosed()"
      (updated)="onEditDialogClosed()"
    />
  }
</div>
