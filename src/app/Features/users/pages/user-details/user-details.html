@if (user(); as u) {
  <div class="app-page detail-page">
    <app-page-header [icon]="'users'" [title]="u.name" [description]="i18n.text('users.memberSince') + ' ' + (u.createdAt | date: 'yyyy-MM-dd')">
      <div pageHeaderActions>
        <button type="button" class="app-page-action app-page-action-secondary" (click)="onBack()">
          <span class="directional-icon" aria-hidden="true">←</span>{{ i18n.text('users.back') }}
        </button>
        <button type="button" class="app-page-action app-page-action-primary" (click)="onEdit()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path>
          </svg>
          {{ i18n.text('users.edit') }}
        </button>
      </div>
    </app-page-header>

    <div class="app-page-section detail-layout">
      <app-profile-card [user]="u" />

      <div class="detail-column">
        <app-detail-card [title]="i18n.text('users.personalInfo')">
          <app-detail-field [label]="i18n.text('users.firstName')" [value]="firstName()" />
          <app-detail-field [label]="i18n.text('users.lastName')" [value]="lastName()" />
          <app-detail-field [label]="i18n.text('users.role')" [value]="i18n.roleLabel(u.role)" />
          <app-detail-field [label]="i18n.text('users.branch')" [value]="i18n.branchLabel(u.branch)" />
        </app-detail-card>

        <app-detail-card [title]="i18n.text('users.contactInfo')">
          <app-detail-field [label]="i18n.text('users.email')" [value]="u.email" />
          <app-detail-field [label]="i18n.text('users.phone')" [value]="u.phone ?? '—'" />
        </app-detail-card>

        <app-detail-card [title]="i18n.text('users.account')">
          <app-detail-field [label]="i18n.text('users.status')" [value]="u.isActive ? i18n.text('users.active') : i18n.text('users.inactive')" />
          <app-detail-field [label]="i18n.text('users.lastLogin')" [value]="u.lastLoginAt ?? '—'" />
          <app-detail-field [label]="i18n.text('users.created')" [value]="u.createdAt" />
        </app-detail-card>

        <section class="detail-card activity-card">
          <h3 class="title">{{ i18n.text('users.recentActivity') }}</h3>
          <app-activity-feed [activities]="activities()" />
        </section>
      </div>
    </div>

    @if (isEditDialogOpen()) {
      <app-edit-user-dialog
        [user]="u"
        (closed)="onEditDialogClosed()"
        (updated)="onEditDialogClosed()"
      />
    }
  </div>
} @else {
  <div class="not-found">{{ i18n.text('users.notFound') }}</div>
}
