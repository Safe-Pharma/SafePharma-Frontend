<div class="flex flex-col h-full bg-slate-50">
  <!-- Tab bar -->
  <div
    class="h-11 shrink-0 bg-white border-b border-slate-200 flex items-center px-3 sm:px-6 gap-2"
  >
    <div
      class="flex items-center gap-1.5 h-8 px-3 rounded-t-lg bg-blue-50 border border-b-0 border-slate-200 text-blue-700 text-sm font-medium"
    >
      <svg
        class="w-3.5 h-3.5"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <line x1="4" y1="9" x2="20" y2="9" />
        <line x1="4" y1="15" x2="20" y2="15" />
        <line x1="10" y1="3" x2="8" y2="21" />
        <line x1="16" y1="3" x2="14" y2="21" />
      </svg>
      <span id="invoiceNumber">INV-491344</span>
      <button class="ml-1 text-blue-400 hover:text-blue-700">
        <svg
          class="w-3.5 h-3.5"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
    </div>
    <button class="flex items-center gap-1.5 text-sm text-slate-400 hover:text-slate-700 px-2">
      <svg
        class="w-4 h-4"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <line x1="12" y1="5" x2="12" y2="19" />
        <line x1="5" y1="12" x2="19" y2="12" />
      </svg>
      <span class="hidden sm:inline">New tab</span>
    </button>
  </div>

  <!-- Search + Customer + User + Invoice strip -->
  <div class="shrink-0 bg-slate-50 px-3 sm:px-6 py-3 border-b border-slate-200">
    <div class="flex flex-col lg:flex-row gap-3">
      <div class="relative flex-1">
        <svg
          class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        <input
          id="productSearch"
          [(ngModel)]="query"
          (input)="searchMedicine(query)"
          type="text"
          placeholder="Search by product name or barcode..."
          class="w-full bg-white border border-slate-200 rounded-xl pl-10 pr-24 py-3 text-sm text-slate-700 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"
        />
      </div>

      <div class="flex flex-wrap gap-3">
        <button
          class="flex items-center gap-2 bg-white border border-slate-200 rounded-xl px-3.5 py-3 text-sm min-w-42.5"
        >
          <svg
            class="w-4 h-4 text-slate-400"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
          <span class="text-slate-700 font-medium flex-1 text-left">Walk-in customer</span>
          <svg
            class="w-4 h-4 text-slate-400"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="6 9 12 15 18 9" />
          </svg>
        </button>

        <div
          class="flex items-center gap-2 bg-white border border-slate-200 rounded-xl px-3.5 py-2"
        >
          <div
            class="w-8 h-8 rounded-full bg-blue-600 text-white text-xs font-semibold flex items-center justify-center shrink-0"
          >
            SK
          </div>
          <div class="leading-tight">
            <p class="text-sm font-semibold text-slate-900">Sarah Khan</p>
            <p class="text-[11px] text-slate-400">Cashier · Terminal 01</p>
          </div>
        </div>

        <div
          class="flex items-center gap-2 bg-white border border-slate-200 rounded-xl px-3.5 py-2"
        >
          <svg
            class="w-4 h-4 text-slate-400"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="4" y1="9" x2="20" y2="9" />
            <line x1="4" y1="15" x2="20" y2="15" />
            <line x1="10" y1="3" x2="8" y2="21" />
            <line x1="16" y1="3" x2="14" y2="21" />
          </svg>
          <div class="leading-tight">
            <p class="text-sm font-semibold text-slate-900">INV-491344</p>
            <p class="text-[11px] text-slate-400 flex items-center gap-1">
              <svg
                class="w-3 h-3"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="3" y="4" width="18" height="18" rx="2" />
                <line x1="16" y1="2" x2="16" y2="6" />
                <line x1="8" y1="2" x2="8" y2="6" />
                <line x1="3" y1="10" x2="21" y2="10" />
              </svg>
              Jul 17, 2026
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Body: cart + summary + icon rail -->
  <div class="flex-1 flex min-h-0 overflow-hidden">
    <div class="flex-1 flex gap-4 p-3 sm:p-6 min-h-0 overflow-y-auto">
      <!-- Cart -->
      <section class="flex-1 min-w-0 bg-white border border-slate-200 rounded-xl flex flex-col">
        <div class="flex items-center justify-between px-5 h-14 border-b border-slate-100 shrink-0">
          <div class="flex items-center gap-2 font-semibold text-slate-900">
            <svg
              class="w-4.5 h-4.5 text-slate-400"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"
              />
              <path d="m3.3 7 8.7 5 8.7-5" />
              <path d="M12 22V12" />
            </svg>
            Cart
          </div>
          <span id="cartCount" class="text-sm text-slate-400">0 items</span>
        </div>

        <!-- Empty state -->
        <div
          id="cartEmptyState"
          class="flex-1 flex flex-col items-center justify-center text-center px-6 py-16"
        >
          <div class="w-16 h-16 rounded-full bg-slate-100 flex items-center justify-center mb-4">
            <svg
              class="w-7 h-7 text-slate-300"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"
              />
              <path d="m3.3 7 8.7 5 8.7-5" />
              <path d="M12 22V12" />
            </svg>
          </div>
          <p class="font-semibold text-slate-700 mb-1">Cart is empty</p>
          <p class="text-sm text-slate-400">Search by barcode or product name to start a sale.</p>
        </div>

        <!-- Cart items list (hidden while empty; populate from Sale.SaleItems) -->
        <div
          id="cartItemsList"
          class="hidden flex-1 overflow-y-auto divide-y divide-slate-100"
        ></div>
      </section>

      <!-- Order summary -->
      <aside class="hidden lg:flex w-[320px] shrink-0 flex-col gap-4">
        <div class="bg-white border border-slate-200 rounded-xl p-5">
          <p class="font-semibold text-slate-900">Order summary</p>
          <p class="text-sm text-slate-400 mb-4">Walk-in customer</p>

          <div class="space-y-2.5 text-sm">
            <div class="flex justify-between">
              <span class="text-slate-500">Subtotal</span>
              <span id="subtotalValue" class="font-medium text-slate-800">$0.00</span>
            </div>
            <div class="flex justify-between">
              <span class="text-slate-500">Discount</span>
              <span id="discountValue" class="font-medium text-amber-500">- $0.00</span>
            </div>
            <div class="flex justify-between">
              <span class="text-slate-500">Tax (5%)</span>
              <span id="taxValue" class="font-medium text-slate-800">$0.00</span>
            </div>
          </div>

          <div class="mt-4 rounded-xl bg-blue-50 px-4 py-3.5">
            <p class="text-[11px] font-semibold tracking-wide text-blue-600">GRAND TOTAL</p>
            <p id="grandTotalValue" class="text-2xl font-bold text-blue-700">$0.00</p>
          </div>

          <button
            id="payButton"
            class="mt-4 w-full bg-blue-500 hover:bg-blue-600 disabled:opacity-50 disabled:cursor-not-allowed text-white font-semibold text-sm rounded-xl py-3.5 transition-colors"
            disabled
          >
            Pay <span id="payButtonAmount">$0.00</span>
          </button>

          <div class="grid grid-cols-2 gap-2 mt-2">
            <button
              class="flex items-center justify-center gap-1.5 border border-slate-200 rounded-xl py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-50"
            >
              <svg
                class="w-4 h-4"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M21 12V7H5a2 2 0 0 1 0-4h14v4" />
                <path d="M3 5v14a2 2 0 0 0 2 2h16v-5" />
                <path d="M18 12a2 2 0 0 0 0 4h4v-4Z" />
              </svg>
              Cash
            </button>
            <button
              class="flex items-center justify-center gap-1.5 border border-slate-200 rounded-xl py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-50"
            >
              <svg
                class="w-4 h-4"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="2" y="5" width="20" height="14" rx="2" />
                <line x1="2" y1="10" x2="22" y2="10" />
              </svg>
              Card
            </button>
          </div>

          <div class="grid grid-cols-2 gap-2 mt-4 pt-4 border-t border-slate-100">
            <button
              class="flex flex-col col-span-1 items-center gap-1 text-slate-500 hover:text-red-600 text-xs"
            >
              <svg
                class="w-4.5 h-4.5"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="12" r="10" />
                <line x1="15" y1="9" x2="9" y2="15" />
                <line x1="9" y1="9" x2="15" y2="15" />
              </svg>
              Cancel
            </button>
            <button
              class="flex flex-col col-span-1 items-center gap-1 text-slate-500 hover:text-slate-700 text-xs"
            >
              <svg
                class="w-4.5 h-4.5"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M3 12a9 9 0 1 0 3-6.7" />
                <path d="M3 5v5h5" />
              </svg>
              Clear
            </button>
          </div>
        </div>
      </aside>
    </div>

    <!-- Right icon rail -->
    <div
      class="hidden lg:flex w-20 shrink-0 flex-col items-center gap-1 py-6 border-l border-slate-200 bg-white"
    >
      <button
        class="flex flex-col items-center justify-center gap-1.5 w-18 py-3 rounded-xl text-slate-500 hover:bg-slate-50 hover:text-slate-800 text-[11px] font-medium"
      >
        <svg
          class="w-4.5 h-4.5"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="19" y1="5" x2="5" y2="19" />
          <circle cx="6.5" cy="6.5" r="2.5" />
          <circle cx="17.5" cy="17.5" r="2.5" />
        </svg>
        Discount
      </button>
      <button
        class="flex flex-col items-center justify-center gap-1.5 w-18 py-3 rounded-xl text-slate-500 hover:bg-slate-50 hover:text-slate-800 text-[11px] font-medium"
      >
        <svg
          class="w-4.5 h-4.5"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="4" y1="9" x2="20" y2="9" />
          <line x1="4" y1="15" x2="20" y2="15" />
          <line x1="10" y1="3" x2="8" y2="21" />
          <line x1="16" y1="3" x2="14" y2="21" />
        </svg>
        Qty
      </button>
      <button
        class="flex flex-col items-center justify-center gap-1.5 w-18 py-3 rounded-xl text-slate-500 hover:bg-slate-50 hover:text-slate-800 text-[11px] font-medium"
      >
        <svg
          class="w-4.5 h-4.5"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M3 6h18" />
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
          <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
        </svg>
        Remove
      </button>
      <button
        class="flex flex-col items-center justify-center gap-1.5 w-18 py-3 rounded-xl text-slate-500 hover:bg-slate-50 hover:text-slate-800 text-[11px] font-medium"
      >
        <svg
          class="w-4.5 h-4.5"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
          <circle cx="9" cy="7" r="4" />
          <line x1="19" y1="8" x2="19" y2="14" />
          <line x1="22" y1="11" x2="16" y2="11" />
        </svg>
        Customer
      </button>
      <button
        class="flex flex-col items-center justify-center gap-1.5 w-18 py-3 rounded-xl text-slate-500 hover:bg-slate-50 hover:text-slate-800 text-[11px] font-medium"
      >
        <svg
          class="w-4.5 h-4.5"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="6 9 6 2 18 2 18 9" />
          <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" />
          <rect x="6" y="14" width="12" height="8" />
        </svg>
        Print
      </button>
    </div>
  </div>

  <!-- Mobile summary bar (shown < lg) -->
  <div
    class="lg:hidden shrink-0 bg-white border-t border-slate-200 px-4 py-3 flex items-center gap-3"
  >
    <div class="flex-1">
      <p class="text-[11px] text-slate-400 leading-tight">Grand total</p>
      <p id="grandTotalValueMobile" class="text-lg font-bold text-blue-700 leading-tight">$0.00</p>
    </div>
    <button
      class="flex items-center gap-1.5 text-slate-500 border border-slate-200 rounded-xl px-3 py-2.5 text-sm"
    >
      <svg
        class="w-4 h-4"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <line x1="19" y1="5" x2="5" y2="19" />
        <circle cx="6.5" cy="6.5" r="2.5" />
        <circle cx="17.5" cy="17.5" r="2.5" />
      </svg>
    </button>
    <button
      class="flex items-center gap-1.5 text-slate-500 border border-slate-200 rounded-xl px-3 py-2.5 text-sm"
    >
      <svg
        class="w-4 h-4"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
        <circle cx="9" cy="7" r="4" />
        <line x1="19" y1="8" x2="19" y2="14" />
        <line x1="22" y1="11" x2="16" y2="11" />
      </svg>
    </button>
    <button
      id="payButtonMobile"
      class="flex-1 bg-blue-500 disabled:opacity-50 text-white font-semibold text-sm rounded-xl py-2.5"
      disabled
    >
      Pay <span id="payButtonAmountMobile">$0.00</span>
    </button>
  </div>
</div>

<!-- ============ Cart line item template ============ -->
<!-- Clone this markup per Sale.SaleItems entry when wiring the API (or use *ngFor in Angular directly on this block) -->
<template id="cartItemTemplate">
  <div class="flex items-center gap-3 px-5 py-3.5" data-cart-item>
    <div
      class="w-11 h-11 rounded-lg bg-slate-100 flex items-center justify-center text-slate-400 shrink-0"
    >
      <svg
        class="w-5 h-5"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z" />
        <path d="m8.5 8.5 7 7" />
      </svg>
    </div>
    <div class="min-w-0 flex-1">
      <p class="text-sm font-semibold text-slate-800 truncate" data-field="medicineName">
        Medicine name
      </p>
      <p class="text-xs text-slate-400" data-field="batchInfo">Batch · $0.00</p>
    </div>
    <div class="flex items-center gap-2 shrink-0">
      <button
        class="w-7 h-7 rounded-md border border-slate-200 flex items-center justify-center text-slate-500 hover:bg-slate-50"
        data-action="decrease"
      >
        <svg
          class="w-3.5 h-3.5"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="5" y1="12" x2="19" y2="12" />
        </svg>
      </button>
      <span class="w-6 text-center text-sm font-medium" data-field="quantity">1</span>
      <button
        class="w-7 h-7 rounded-md border border-slate-200 flex items-center justify-center text-slate-500 hover:bg-slate-50"
        data-action="increase"
      >
        <svg
          class="w-3.5 h-3.5"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="12" y1="5" x2="12" y2="19" />
          <line x1="5" y1="12" x2="19" y2="12" />
        </svg>
      </button>
    </div>
    <p class="w-16 text-right text-sm font-semibold text-slate-800 shrink-0" data-field="lineTotal">
      $0.00
    </p>
    <button class="text-slate-300 hover:text-red-500 shrink-0" data-action="remove">
      <svg
        class="w-4 h-4"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M3 6h18" />
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
        <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
      </svg>
    </button>
  </div>
</template>
