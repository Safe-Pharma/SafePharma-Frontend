<!-- Backdrop -->
<div
  *ngIf="isOpen()"
  appModalOverlay class="fixed inset-0 bg-black/30 z-40 transition-opacity duration-200"
  (click)="onClose()"
></div>

<!-- Modal -->
<div
  *ngIf="isOpen()"
  appModalOverlay class="fixed end-0 top-0 h-full w-full sm:w-[500px] lg:w-[600px] bg-white shadow-2xl z-50 overflow-y-auto animate-in slide-in-from-end duration-300"
>
  <div *ngIf="auditLog()" class="h-full flex flex-col">
    <!-- Header -->
    <div
      class="sticky top-0 bg-white border-b border-gray-200 px-6 py-4 flex items-start justify-between gap-4"
    >
      <div class="flex flex-row items-center justify-center gap-3">
        <!-- Action Badge -->
        <span
          [ngClass]="
            'inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold border  ' +
            getActionColor(auditLog()!.action)
          "
        >
          <span
            [ngClass]="'w-2 h-2 rounded-full me-2 ' + getActionDotColor(auditLog()!.action)"
          ></span>
          {{ actionLabel(auditLog()!.action) }}
        </span>
        <!-- Title -->
        <h3 class="m-0 p-0 text-2xl font-semibold text text-gray-900">
          {{ entityLabel(auditLog()!.entity) }}
        </h3>
      </div>

      <!-- Close Button -->
      <button
        (click)="onClose()"
        class="p-2 hover:bg-gray-100 rounded-lg transition-colors duration-200 cursor-pointer"
      >
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="text-gray-500 hover:text-gray-700"
        >
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <!-- Tabs -->
    <div class="border-b border-gray-200 px-6">
      <button
        class="py-4 font-medium text-sm text-gray-600 hover:text-gray-900 transition-colors duration-200"
      >
        {{ text('audit.details') }}
      </button>
    </div>

    <!-- Content -->
    <div class="flex-1 px-6 py-6">
      <!-- Summary Tab -->

      <div *ngIf="activeTab() === 'summary'" class="space-y-6">
        <!-- Timestamp -->
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase mb-2">{{ text('audit.timestamp') }}</label>
          <p class="text-gray-900">
            {{ getFormattedDate(auditLog()!.date) }} {{ getFormattedTime(auditLog()!.date) }}
          </p>
        </div>

        <!-- User -->
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase mb-2">{{ text('audit.user') }}</label>
          <p class="text-gray-900">{{ auditLog()!.userFullName }}</p>
        </div>

        <!-- Device -->
        <div *ngIf="auditLog()!.device">
          <label class="block text-xs font-semibold text-gray-500 uppercase mb-2">{{ text('audit.device') }}</label>
          <p class="text-gray-900">{{ auditLog()!.device }}</p>
        </div>

        <!-- New Value -->
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase mb-2">{{ text('audit.newValue') }}</label>
          <pre
            class="bg-gray-50 p-4 rounded-lg text-xs text-gray-700 overflow-x-auto border border-gray-200"
            >{{ getFormattedNewValue() }}</pre
          >
        </div>

        <div *ngIf="auditLog()!.oldValues !== null && auditLog()!.oldValues !== undefined">
          <label class="block text-xs font-semibold text-gray-500 uppercase mb-2">{{ text('audit.oldValue') }}</label>
          <pre
            class="bg-gray-50 p-4 rounded-lg text-xs text-gray-700 overflow-x-auto border border-gray-200"
            >{{ getFormattedOldValue() }}</pre
          >
        </div>
      </div>
    </div>
  </div>
</div>
