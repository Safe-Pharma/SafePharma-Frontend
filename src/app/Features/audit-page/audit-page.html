<!-- Audit History Section -->
<div class="bg-background px-2">
  <!-- Header -->
  <div
    class="px-0 pt-4 pb-6 border-gray-200 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4"
  >
    <div>
      <h1 class="text-2xl px-0 sm:text-3xl font-bold text-gray-900">Audit History</h1>
      <p class="text-sm text-gray-500 mt-1">
        Full immutable activity log for compliance and forensics
      </p>
    </div>
  </div>
  <div class="bg-white shadow-sm rounded-lg overflow-hidden border border-gray-200">
    <!-- Filters & Search -->
    <div class="px-6 py-4">
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-7 gap-3">
        <!-- Search Input -->
        <div class="lg:col-span-3">
          <div class="relative">
            <svg
              class="absolute left-3 top-3 w-5 h-5 text-gray-600"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input
              type="text"
              [(ngModel)]="searchQuery"
              (ngModelChange)="onFilterChange()"
              placeholder="Search activity..."
              class="w-full pl-10 pr-4 py-2.5 bg-background border rounded-lg text-sm border-gray-300 text-gray-600 placeholder-gray-600 focus:outline-none focus:border-gray-400 focus:ring-1 focus:ring-gray-400"
            />
          </div>
        </div>

        <!-- All Users Dropdown -->
        <div class="lg:col-span-1">
          <select
            [(ngModel)]="selectedUser"
            (ngModelChange)="onFilterChange()"
            class="w-full bg-background px-4 py-2.5 border border-gray-300 rounded-lg text-sm text-gray-700 hover:border-gray-400 focus:outline-none focus:border-gray-400 focus:ring-1 focus:ring-gray-400 cursor-pointer"
          >
            <option value="">All users</option>
            <option *ngFor="let log of getUniqueUsers(); let idx = index" value="{log}">
              {{ log }}
            </option>
          </select>
        </div>

        <!-- All Actions Dropdown -->
        <div class="lg:col-span-1">
          <select
            [(ngModel)]="selectedAction"
            (ngModelChange)="onFilterChange()"
            class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm text-gray-700 bg-background hover:border-gray-400 focus:outline-none focus:border-gray-400 focus:ring-1 focus:ring-gray-400 cursor-pointer"
          >
            <option value="">All actions</option>
            <option *ngFor="let log of getUniqueActions(); let idx = index" value="{log}">
              {{ log }}
            </option>
          </select>
        </div>

        <!-- All Entities Dropdown -->
        <div class="lg:col-span-1">
          <select
            [(ngModel)]="selectedEntity"
            (ngModelChange)="onFilterChange()"
            class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm text-gray-700 bg-background hover:border-gray-400 focus:outline-none focus:border-gray-400 focus:ring-1 focus:ring-gray-400 cursor-pointer"
          >
            <option value="">All entities</option>

            <option *ngFor="let log of getUniqueEntities(); let idx = index" value="{log}">
              {{ log }}
            </option>
          </select>
        </div>

        <!-- Date Input -->
        <div class="lg:col-span-1">
          <input
            type="date"
            [(ngModel)]="selectedDate"
            (ngModelChange)="onFilterChange()"
            class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm text-gray-700 bg-background hover:border-gray-400 focus:outline-none focus:border-gray-400 focus:ring-1 focus:ring-gray-400 cursor-pointer"
          />
        </div>
      </div>
    </div>

    <!-- Table Container - Responsive Wrapper -->
    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead>
          <tr class="border-b border-t border-gray-300 bg-background">
            <th class="px-6 py-4 text-left font-semibold text-gray-700">Date & Time</th>
            <th class="px-6 py-4 text-left font-semibold text-gray-700 hidden sm:table-cell">
              User
            </th>
            <th class="px-6 py-4 text-left font-semibold text-gray-700">Action</th>
            <th class="px-6 py-4 text-left font-semibold text-gray-700 hidden md:table-cell">
              Entity
            </th>
            <th class="px-6 py-4 text-left font-semibold text-gray-700 hidden xl:table-cell">
              Device
            </th>
          </tr>
        </thead>
        <tbody>
          <!-- Dynamic rows -->
          <tr
            *ngFor="let log of filteredLogs(); let idx = index"
            (click)="openModal(log)"
            class="border-b border-gray-200 hover:bg-gray-50 transition-colors duration-150 hover:cursor-pointer"
          >
            <td class="px-6 py-4 text-gray-700">{{ log.date }}</td>
            <td class="px-6 py-4 text-gray-700 hidden sm:table-cell">{{ log.userFullName }}</td>
            <td class="px-6 py-4">
              <span
                [ngClass]="
                  'inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold border ' +
                  getActionColor(log.action)
                "
              >
                <span
                  [ngClass]="'w-2 h-2 rounded-full mr-2 ' + getActionDotColor(log.action)"
                ></span>
                {{ log.action }}
              </span>
            </td>
            <td class="px-6 py-4 text-gray-700 hidden md:table-cell">{{ log.entity }}</td>

            <td class="px-6 py-4 text-gray-700 hidden xl:table-cell">{{ log.device }}</td>
          </tr>

          <!-- Empty state -->
          <tr *ngIf="filteredLogs().length === 0">
            <td [attr.colspan]="7" class="px-6 py-8 text-center text-gray-500">
              No audit logs found matching your filters
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Pagination (Optional) -->
    ,<!-- <div
      class="px-6 py-4 border-t border-gray-200 flex items-center justify-between text-sm text-gray-600"
    >
      <p>Showing {{ filteredLogs.length }} of {{ auditLogs.length }} entries</p>
      <div class="flex gap-2">
        <button
          class="px-3 py-1.5 rounded border border-gray-300 text-gray-700 hover:bg-gray-50 transition-colors"
        >
          Previous
        </button>
        <button class="px-3 py-1.5 rounded border border-gray-300 bg-gray-100 text-gray-900">
          1
        </button>
        <button
          class="px-3 py-1.5 rounded border border-gray-300 text-gray-700 hover:bg-gray-50 transition-colors"
        >
          2
        </button>
        <button
          class="px-3 py-1.5 rounded border border-gray-300 text-gray-700 hover:bg-gray-50 transition-colors"
        >
          Next
        </button>
      </div>
    </div>-->
  </div>
</div>

<app-audit-detail-modal-component
  [isOpen]="isModalOpen"
  [auditLog]="selectedLog"
  (close)="closeModal()"
></app-audit-detail-modal-component>
