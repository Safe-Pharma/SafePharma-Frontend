<div class="flex min-h-[calc(100vh-65px)] items-center justify-center px-6 py-12">
  <form
    [formGroup]="loginForm"
    (ngSubmit)="onSubmit()"
    class="card w-full max-w-md animate-fade-in-up space-y-4"
  >
    <h1 class="text-2xl font-bold text-foreground">{{ text('ownerLogin.title') }}</h1>
    <p class="text-sm text-muted-foreground">{{ text('ownerLogin.description') }}</p>

    @if (formError(); as error) {
      <div
        class="rounded-lg border border-destructive/30 bg-destructive/10 px-4 py-3 text-sm text-destructive"
      >
        {{ error }}
      </div>
    }

    <div>
      <label class="mb-1 block text-sm font-medium text-foreground" for="owner-email">{{ text('auth.email') }}</label>
      <input
        id="owner-email"
        type="email"
        formControlName="email"
        [placeholder]="text('ownerLogin.emailPlaceholder')"
        autocomplete="username"
        class="input"
        [class.border-destructive]="email.invalid && email.touched"
      />
      @if (getErrorMessage(email); as error) {
        <p class="error">{{ error }}</p>
      }
    </div>

    <div>
      <label class="mb-1 block text-sm font-medium text-foreground" for="owner-password">{{ text('auth.password') }}</label>
      <input
        id="owner-password"
        type="password"
        formControlName="password"
        [placeholder]="text('ownerLogin.passwordPlaceholder')"
        autocomplete="current-password"
        class="input"
        [class.border-destructive]="password.invalid && password.touched"
      />
      @if (getErrorMessage(password); as error) {
        <p class="error">{{ error }}</p>
      }
    </div>

    <button
      type="submit"
      [disabled]="loading()"
      class="btn mt-6 flex w-full justify-center disabled:cursor-not-allowed disabled:opacity-50"
    >
      @if (loading()) {
        <app-spinner /><span>{{ text('auth.signingIn') }}</span>
      } @else {
        {{ text('auth.signIn') }}
      }
    </button>
  </form>
</div>
