<header
  class="flex h-16 items-center justify-between gap-3 border-b border-border bg-background/80 px-4 backdrop-blur-md md:px-6"
>
  <div class="flex items-center gap-3">
    <button
      type="button"
      class="grid h-9 w-9 place-items-center rounded-lg text-muted-foreground hover:bg-muted md:hidden"
      [attr.aria-label]="i18n.t('nav.openNavigation')"
      (click)="openMobileNav.emit()"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="h-5 w-5"
      >
        <line x1="4" x2="20" y1="6" y2="6"></line>
        <line x1="4" x2="20" y1="12" y2="12"></line>
        <line x1="4" x2="20" y1="18" y2="18"></line>
      </svg>
    </button>
    <h1 class="truncate text-base font-semibold text-foreground md:text-lg">{{ title }}</h1>
  </div>

  <div class="flex items-center gap-2 md:gap-3">
    <!-- Language switch -->
    <button
      type="button"
      class="inline-flex min-h-10 items-center justify-center gap-1.5 rounded-full border border-primary/20 bg-primary-soft/70 px-3 text-xs font-semibold text-primary shadow-sm transition-all hover:border-primary/30 hover:bg-primary-soft active:scale-[.98] active:bg-primary-soft/90 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2"
      [attr.aria-label]="i18n.lang() === 'en' ? i18n.t('nav.languageArabic') : i18n.t('nav.languageEnglish')"
      [attr.title]="i18n.lang() === 'en' ? i18n.t('nav.languageArabic') : i18n.t('nav.languageEnglish')"
      (click)="i18n.toggle()"
    >
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-3.5 w-3.5 shrink-0" aria-hidden="true">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M3 12h18"></path>
        <path d="M12 3a14 14 0 0 1 0 18"></path>
        <path d="M12 3a14 14 0 0 0 0 18"></path>
      </svg>
      {{ i18n.lang() === 'en' ? i18n.t('nav.languageArabic') : i18n.t('nav.languageEnglish') }}
    </button>

    <a
      routerLink="/portal/profile"
      class="flex items-center gap-2 rounded-lg px-2 py-1.5 hover:bg-muted"
    >
      <span class="hidden text-sm font-medium text-foreground sm:inline">
        {{ displayName() || portalAuth.session()?.name }}
      </span>
      <span
        class="grid h-8 w-8 place-items-center rounded-full bg-primary-soft text-xs font-semibold text-primary"
      >
        {{ displayInitials() || portalAuth.session()?.initials }}
      </span>
    </a>
  </div>
</header>
