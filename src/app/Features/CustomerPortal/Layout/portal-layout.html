@if (portalAuth.isAuthenticated()) {
  <div class="flex min-h-screen overflow-hidden bg-background">
    <portal-sidebar
      [mobileOpen]="mobileNavOpen()"
      (closeMobile)="mobileNavOpen.set(false)"
      (logout)="onLogout()"
    />

    <div class="flex min-w-0 flex-1 flex-col">
      <portal-topbar [title]="i18n.t(pageTitle())" (openMobileNav)="mobileNavOpen.set(true)" />

      <main class="flex-1 overflow-y-auto p-4 md:p-6">
        <router-outlet />
      </main>
    </div>
  </div>
  <app-toast />
}
