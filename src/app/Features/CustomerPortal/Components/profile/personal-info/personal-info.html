<div class="rounded-xl border border-border bg-card p-5">
  @if (loading()) {
    <div class="space-y-4">
      <portal-skeleton [height]="38" />
      <portal-skeleton [height]="38" />
      <portal-skeleton [height]="38" />
    </div>
  } @else {
    <form (ngSubmit)="save()">
      <div class="grid gap-4 sm:grid-cols-2">
        <div>
          <label class="mb-1.5 block text-sm font-medium text-foreground">Full name</label>
          <input
            type="text"
            class="w-full rounded-lg border border-border px-3.5 py-2.5 text-sm outline-none ring-ring focus:ring-2"
            [(ngModel)]="form.name"
            (ngModelChange)="markDirty()"
            name="name"
            required
          />
        </div>

        <div>
          <label class="mb-1.5 block text-sm font-medium text-foreground">
            Phone number
            <span class="ms-1 rounded bg-muted px-1.5 py-0.5 text-[10px] font-semibold uppercase tracking-wide text-muted-foreground">Read only</span>
          </label>
          <input
            type="text"
            class="w-full cursor-not-allowed rounded-lg border border-border bg-muted px-3.5 py-2.5 text-sm text-muted-foreground"
            [value]="profile()?.phone"
            disabled
          />
        </div>

        <div>
          <label class="mb-1.5 block text-sm font-medium text-foreground">Email</label>
          <input
            type="email"
            class="w-full rounded-lg border border-border px-3.5 py-2.5 text-sm outline-none ring-ring focus:ring-2"
            [(ngModel)]="form.email"
            (ngModelChange)="markDirty()"
            name="email"
          />
        </div>

        <div>
          <label class="mb-1.5 block text-sm font-medium text-foreground">Date of birth</label>
          <input
            type="date"
            class="w-full rounded-lg border border-border px-3.5 py-2.5 text-sm outline-none ring-ring focus:ring-2"
            [(ngModel)]="form.dateOfBirth"
            (ngModelChange)="markDirty()"
            name="dateOfBirth"
          />
        </div>

        <div class="sm:col-span-2">
          <label class="mb-1.5 block text-sm font-medium text-foreground">Address</label>
          <input
            type="text"
            class="w-full rounded-lg border border-border px-3.5 py-2.5 text-sm outline-none ring-ring focus:ring-2"
            [(ngModel)]="form.address"
            (ngModelChange)="markDirty()"
            name="address"
          />
        </div>

        <div class="sm:col-span-2">
          <label class="mb-1.5 block text-sm font-medium text-foreground">Notes</label>
          <textarea
            rows="3"
            class="w-full rounded-lg border border-border px-3.5 py-2.5 text-sm outline-none ring-ring focus:ring-2"
            [(ngModel)]="form.notes"
            (ngModelChange)="markDirty()"
            name="notes"
          ></textarea>
        </div>
      </div>

      <div class="mt-5 flex items-center justify-between">
        @if (dirty()) {
          <p class="text-xs text-warning">You have unsaved changes.</p>
        } @else {
          <span></span>
        }
        <button
          type="submit"
          class="rounded-lg bg-primary px-4 py-2.5 text-sm font-semibold text-primary-foreground hover:opacity-90 disabled:cursor-not-allowed disabled:opacity-60"
          [disabled]="saving() || !dirty()"
        >
          {{ saving() ? 'Saving…' : 'Save changes' }}
        </button>
      </div>
    </form>
  }
</div>
