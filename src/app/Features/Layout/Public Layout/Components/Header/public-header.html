    <header class="sticky top-0 z-40 border-b border-border/60 bg-background/80 backdrop-blur-md">
      <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-6">
        <!-- Brand -->
        <div class="flex items-center gap-2">
          <div class="grid h-8 w-8 shrink-0 place-items-center rounded-lg bg-gradient-to-br from-primary to-success text-primary-foreground shadow-card">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4" aria-hidden="true">
              <path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"></path>
              <path d="m8.5 8.5 7 7"></path>
            </svg>
          </div>
          <div class="leading-tight">
            <div class="text-sm font-semibold tracking-tight text-foreground">{{ text('brand.name') }}</div>
            <div class="text-[10px] font-medium uppercase tracking-wider text-muted-foreground">{{ text('public.pharmacyErp') }}</div>
          </div>
        </div>

        <!-- Nav -->
        <nav class="hidden items-center gap-8 text-sm text-muted-foreground md:flex">
          <a href="#features" class="transition-colors hover:text-foreground">{{ text('public.features') }}</a>
          <a href="#pricing" class="transition-colors hover:text-foreground">{{ text('public.pricing') }}</a>
          <a href="#contact" class="transition-colors hover:text-foreground">{{ text('public.contact') }}</a>
        </nav>

        <!-- Actions -->
        <div class="flex items-center gap-2">
          <button
            type="button"
            class="inline-flex min-h-9 min-w-[4.5rem] items-center justify-center gap-1.5 rounded-full border border-primary/20 bg-primary-soft/70 px-3 text-xs font-semibold text-primary shadow-sm transition-all hover:border-primary/30 hover:bg-primary-soft active:scale-[.98] active:bg-primary-soft/90 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2"
            (click)="toggleLanguage()"
            [attr.aria-label]="i18n.lang() === 'ar' ? text('language.switchToEnglish') : text('language.switchToArabic')"
            [attr.title]="i18n.lang() === 'ar' ? text('language.switchToEnglish') : text('language.switchToArabic')"
          >
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-3.5 w-3.5 shrink-0" aria-hidden="true">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M3 12h18"></path>
              <path d="M12 3a14 14 0 0 1 0 18"></path>
              <path d="M12 3a14 14 0 0 0 0 18"></path>
            </svg>
            <span>{{ i18n.lang() === 'ar' ? 'EN' : 'AR' }}</span>
          </button>
          <a
            routerLink="/portal/login"
            class="hidden items-center justify-center gap-2 whitespace-nowrap font-medium cursor-pointer transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring hover:bg-accent hover:text-accent-foreground h-8 rounded-md px-3 text-xs lg:inline-flex"
          >
            {{ text('public.patientPortal') }}
          </a>
          <a
            routerLink="/login"
            class="inline-flex items-center justify-center gap-2 whitespace-nowrap font-medium cursor-pointer transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring hover:bg-accent hover:text-accent-foreground h-8 rounded-md px-3 text-xs"
          >
            {{ text('public.pharmacySignIn') }}
          </a>
          <a
            routerLink="/subscribe"
            class="inline-flex items-center justify-center gap-2 whitespace-nowrap font-medium cursor-pointer transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring bg-primary text-primary-foreground shadow hover:bg-primary/90 h-8 rounded-md px-3 text-xs"
          >
            {{ text('public.subscribePharmacy') }}
          </a>
        </div>
      </div>
    </header>
