<div
  class="sidebar-backdrop fixed inset-0 z-40 bg-slate-950/35 backdrop-blur-[1px] lg:hidden"
  [class.sidebar-backdrop-visible]="mobileOpen"
  [attr.aria-hidden]="!mobileOpen"
  (click)="closeOnMobile()"
></div>

<aside
  class="app-sidebar fixed inset-y-0 start-0 z-50 flex min-h-screen w-56 shrink-0 flex-col border-e border-sidebar-border bg-sidebar text-sidebar-foreground shadow-xl transition-transform duration-200 ease-out lg:static lg:z-auto lg:min-h-0 lg:shadow-none lg:transition-[width] lg:duration-200"
  [class.sidebar-open]="mobileOpen"
  [class.sidebar-closed]="!mobileOpen"
  [class.sidebar-collapsed]="collapsed"
  [ngClass]="collapsed ? 'lg:w-16' : 'lg:w-56'"
>
  <div class="sidebar-header flex h-16 items-center justify-between border-b border-sidebar-border px-3">
    <div class="flex items-center gap-2">
      <div
        class="sidebar-brand-mark grid h-8 w-8 shrink-0 place-items-center rounded-lg bg-gradient-to-br from-primary to-success text-primary-foreground shadow-card"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5" aria-hidden="true">
          <path d="M10 12h4"></path>
          <path d="M10 8h4"></path>
          <path d="M14 21v-3a2 2 0 0 0-4 0v3"></path>
          <path d="M6 10H4a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-2"></path>
          <path d="M6 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16"></path>
        </svg>
      </div>
      @if (!collapsed) {
        <div class="leading-tight">
          <div class="text-sm font-semibold tracking-tight text-foreground">{{ text('brand.name') }}</div>
          <div class="text-[10px] font-medium uppercase tracking-wider text-muted-foreground">{{ text('public.pharmacyErp') }}</div>
        </div>
      }
    </div>
    <button
      type="button"
      class="sidebar-collapse-trigger hidden h-7 w-7 place-items-center rounded-md text-muted-foreground hover:bg-sidebar-accent hover:text-foreground lg:grid"
      [attr.aria-label]="text('nav.toggleSidebar')"
      [attr.aria-expanded]="!collapsed"
      (click)="toggleCollapsed()"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="sidebar-collapse-icon h-4 w-4 transition-transform" aria-hidden="true">
        <path d="m15 18-6-6 6-6"></path>
      </svg>
    </button>
    <button
      type="button"
      class="grid h-8 w-8 place-items-center rounded-md text-muted-foreground hover:bg-sidebar-accent hover:text-foreground lg:hidden"
      [attr.aria-label]="text('nav.closeSidebar')"
      (click)="closeOnMobile()"
    >
      <span aria-hidden="true" class="text-xl leading-none">×</span>
    </button>
  </div>

  <!-- Nav -->
  <nav class="flex-1 space-y-0.5 overflow-y-auto p-2.5">
    @for (item of navItems; track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive
        #rla="routerLinkActive"
        [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
        class="group flex items-center gap-2.5 rounded-lg px-2.5 py-2 text-sm font-medium transition-colors hover:bg-sidebar-accent hover:text-sidebar-accent-foreground"
        [ngClass]="rla.isActive ? 'bg-sidebar-primary/10 text-sidebar-primary' : 'text-sidebar-foreground/80'"
        [attr.aria-current]="rla.isActive ? 'page' : null"
        (click)="closeOnMobile()"
      >
        <span
          class="h-4.5 w-4.5 shrink-0"
          [ngClass]="rla.isActive ? 'text-sidebar-primary' : ''"
          [innerHTML]="item.icon | safeHtml"
        ></span>
        @if (!collapsed) {
          <span class="truncate">{{ text(item.label) }}</span>
          @if (rla.isActive) {
            <span class="ms-auto h-1.5 w-1.5 rounded-full bg-sidebar-primary"></span>
          }
        }
      </a>
    }
  </nav>

  <!-- Logout -->
  <div class="border-t border-sidebar-border p-2.5">
    <button
      type="button"
      class="flex w-full items-center gap-2.5 rounded-lg px-2.5 py-2 text-sm font-medium text-sidebar-foreground/80 hover:bg-destructive-soft hover:text-destructive"
      (click)="logout.emit(); closeOnMobile()"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4.5 w-4.5 shrink-0" aria-hidden="true">
        <path d="m16 17 5-5-5-5"></path>
        <path d="M21 12H9"></path>
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
      </svg>
      @if (!collapsed) {
        <span>{{ text('common.actions.logout') }}</span>
      }
    </button>
  </div>
</aside>
