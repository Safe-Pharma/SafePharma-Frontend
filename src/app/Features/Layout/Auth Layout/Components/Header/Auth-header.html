<header class="border-b border-border bg-background">
  <div class="mx-auto flex h-16 max-w-6xl items-center justify-between px-6">
    <div class="flex items-center gap-2">
      <div class="grid h-8 w-8 shrink-0 place-items-center rounded-lg bg-gradient-to-br from-primary to-success text-primary-foreground shadow-card">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4" aria-hidden="true">
          <path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"></path>
          <path d="m8.5 8.5 7 7"></path>
        </svg>
      </div>
      <div class="leading-tight">
        <div class="text-sm font-semibold tracking-tight text-foreground">MediRx</div>
        <div class="text-[10px] font-medium uppercase tracking-wider text-muted-foreground">{{ text('public.pharmacyErp') }}</div>
      </div>
    </div>

    <div class="flex items-center gap-3">
    <button type="button" class="rounded-md px-2 py-1 text-xs font-semibold hover:bg-accent" (click)="toggleLanguage()"
      [attr.aria-label]="i18n.lang() === 'ar' ? text('language.switchToEnglish') : text('language.switchToArabic')">
      {{ i18n.lang() === 'ar' ? 'EN' : 'AR' }}
    </button>
    <a
      routerLink="/"
      class="inline-flex items-center gap-1.5 text-xs font-medium text-muted-foreground hover:text-foreground"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-3.5 w-3.5" aria-hidden="true">
        <path d="m12 19-7-7 7-7"></path>
        <path d="M19 12H5"></path>
      </svg>
      {{ text('public.back') }}
    </a>
    </div>
  </div>
</header>
