<div class="min-h-[calc(100vh-65px)] p-6 md:p-8">
  <div class="mx-auto max-w-3xl animate-fade-in-up rounded-2xl border border-border bg-card p-6 shadow-card md:p-8">

    <!-- Header -->
    <div class="flex items-start gap-4">
      <div class="flex h-14 w-14 shrink-0 items-center justify-center rounded-full bg-primary-soft text-xl font-bold text-primary ring-4 ring-primary/5">
        {{ (user()?.fullName ?? 'U').charAt(0).toUpperCase() }}
      </div>
      <div>
        <p class="flex items-center gap-1.5 text-sm font-medium text-muted-foreground">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          Account
        </p>
        <h1 class="mt-1 text-3xl font-bold tracking-tight text-foreground">Profile</h1>
        <p class="mt-1 text-sm text-muted-foreground">User details decoded from the authentication token.</p>
      </div>
    </div>

    <div class="mt-8 h-px w-full bg-border"></div>

    <!-- Info cards -->
    <div class="mt-8 grid gap-4 md:grid-cols-2">
      <div class="group rounded-xl border border-border bg-background p-4 transition-all duration-200 hover:-translate-y-0.5 hover:border-border-strong hover:shadow-card">
        <p class="flex items-center gap-1.5 text-xs uppercase tracking-wide text-muted-foreground">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Full name
        </p>
        <p class="mt-2 text-lg font-semibold text-foreground">{{ user()?.fullName ?? 'User' }}</p>
      </div>

      <div class="group rounded-xl border border-border bg-background p-4 transition-all duration-200 hover:-translate-y-0.5 hover:border-border-strong hover:shadow-card">
        <p class="flex items-center gap-1.5 text-xs uppercase tracking-wide text-muted-foreground">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/></svg>
          Role
        </p>
        <p class="mt-2 text-lg font-semibold text-foreground">{{ user()?.role ?? 'User' }}</p>
      </div>

      <div class="group rounded-xl border border-border bg-background p-4 transition-all duration-200 hover:-translate-y-0.5 hover:border-border-strong hover:shadow-card md:col-span-2">
        <p class="flex items-center gap-1.5 text-xs uppercase tracking-wide text-muted-foreground">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>
          Email
        </p>
        <p class="mt-2 text-lg font-semibold text-foreground">{{ user()?.email ?? 'Not available' }}</p>
      </div>
    </div>

    <!-- Actions -->
    <div class="mt-8 flex flex-wrap gap-3">
      <a routerLink="/app/change-password" class="btn flex justify-center w-auto items-center gap-2 px-5">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        Change Password
      </a>
      <a routerLink="/app/settings" class="btn w-auto bg-accent text-center flex justify-center px-5 text-accent-foreground hover:bg-accent/80  items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
        Preferences
      </a>
    </div>
  </div>
</div>
