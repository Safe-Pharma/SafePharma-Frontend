<div class="grid gap-1.5">
  @if (selectedItems().length > 0) {
  <div class="flex flex-wrap gap-1.5">
    @for (item of selectedItems(); track item.id) {
    <span class="inline-flex items-center gap-1.5 rounded-full bg-muted px-2 py-1 text-xs">
      {{ item.label }}
      <button type="button" (click)="onRemove(item.id)"
        class="cursor-pointer text-muted-foreground hover:text-destructive">×</button>
    </span>
    }
  </div>
  }

  <div class="relative">
    <input type="text" [value]="query()" [placeholder]="placeholder()" (input)="onQueryInput($any($event.target).value)"
      (focus)="onFocus()" (blur)="onBlur()"
      class="flex h-9 w-full rounded-md border border-input bg-transparent px-3 py-1 text-sm shadow-sm focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring" />

    @if (showDropdown()) {
    <div class="absolute z-10 mt-1 max-h-56 w-full overflow-y-auto rounded-md border border-border bg-card py-1 shadow-card">
      @if (filteredItems().length === 0) {
      <div class="px-3 py-2 text-xs text-muted-foreground">{{ emptyLabel() }}</div>
      } @else {
      @for (item of filteredItems(); track item.id) {
      <button type="button" (mousedown)="onSelect(item)"
        class="block w-full px-3 py-2 text-left text-xs hover:bg-accent">
        {{ item.label }}
      </button>
      }
      }
    </div>
    }
  </div>
</div>
